name: J03 FUE catalogue proof (no deploy)
on:
  push:
    branches: [quality/j03-fue-20261127, main, quality/main-ci-20261127]
  pull_request:
    branches: [feature/j03-pg-20261127, main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Exact FUE source boundary
        if: (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'quality/main-ci-20261127') || (github.event_name == 'pull_request' && github.base_ref != 'main')
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 87251a8ef22c9d3065c94755ba80d11976530122 HEAD
          git diff --exit-code 87251a8ef22c9d3065c94755ba80d11976530122 HEAD -- apps/web/src apps/web/public apps/api pnpm-lock.yaml
          test "$(git diff --name-only 87251a8ef22c9d3065c94755ba80d11976530122 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j03-fue.yml apps/web/scripts/j03-fue.mjs | LC_ALL=C sort)"
      - name: Verify approved J05 integration scope (legacy regression continues)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/j05-r2-p0-20261127'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD
          git diff --exit-code 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD -- apps/web apps/api packages pnpm-lock.yaml
          test "$(git diff --name-only 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml | LC_ALL=C sort)"
      - name: Verify integrated main provenance and CI-only scope
        if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'quality/main-ci-20261127')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'feature/j05-r2-p0-20261127')
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 63975ae83e82cf160a4e5361804fa5a7c01d3977 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test -n "$PR_BASE_SHA"
            git merge-base --is-ancestor "$PR_BASE_SHA" HEAD
          fi
          if [ "$PR_HEAD_REF" = "quality/main-ci-20261127" ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSH_REF" = "quality/main-ci-20261127" ]; }; then
            test "$(git diff --name-only 63975ae83e82cf160a4e5361804fa5a7c01d3977 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml .github/workflows/recovery-product-ci.yml | LC_ALL=C sort)"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Browser setup pinned to previously qualified R4 lock
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Install MP4 encoder
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Actual FUE catalogue, screenshots and recordings
        run: |
          set -euo pipefail
          export J03_EVIDENCE="$RUNNER_TEMP/j03-fue"
          mkdir -p "$J03_EVIDENCE" proof
          pnpm --filter @panokit/web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j03-next.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          node apps/web/scripts/j02-browser-check.mjs
          node apps/web/scripts/j03-browser-check.mjs
          node apps/web/scripts/j03-fue.mjs
          for lang in fr ar; do
            for width in 390 1440; do
              key="$lang-$width"
              ffmpeg -nostdin -v error -y -i "$J03_EVIDENCE/$key.webm" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$J03_EVIDENCE/$key.mp4"
              ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of json "$J03_EVIDENCE/$key.mp4" > "$J03_EVIDENCE/$key-video.json"
              test -s "$J03_EVIDENCE/$key.mp4"
              rm "$J03_EVIDENCE/$key.webm"
            done
          done
          rm -rf "$J03_EVIDENCE/raw"
          (cd "$J03_EVIDENCE"; test "$(find . -maxdepth 1 -name '*.jpeg' | wc -l)" = 24; sha256sum *.jpeg *.mp4 *.json > SHA256SUMS)
      - name: Upload actual FUE proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j03-fue-evidence
          path: ${{ runner.temp }}/j03-fue
          retention-days: 30
          if-no-files-found: error
