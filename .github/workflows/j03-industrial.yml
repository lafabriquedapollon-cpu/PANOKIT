name: J03 industrial admission LAB (no deploy)
on:
  push:
    branches: [feature/j03-industrial-20261127, main, quality/main-ci-20261127]
  pull_request:
    branches: [feature/j03-continuity-20261127, main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Exact inactive LAB boundary
        if: (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'quality/main-ci-20261127') || (github.event_name == 'pull_request' && github.base_ref != 'main')
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6e346eefe166342dd1e87aebb8d47f5a2fcae24e HEAD
          git diff --exit-code 6e346eefe166342dd1e87aebb8d47f5a2fcae24e HEAD -- apps/web apps/api/src/app.module.ts apps/api/src/main.ts pnpm-lock.yaml
          test "$(git diff --name-only 6e346eefe166342dd1e87aebb8d47f5a2fcae24e HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j03-industrial.yml apps/api/src/j03-industrial.spec.ts apps/api/src/j03/industrial-admission.ts docs/j03-industrial-admission.md | LC_ALL=C sort)"
      - name: Verify approved J05 integration scope (legacy regression continues)
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/j05-r2-p0-20261127'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD
          git diff --exit-code 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD -- apps/web apps/api packages pnpm-lock.yaml
          test "$(git diff --name-only 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml | LC_ALL=C sort)"
      - name: Verify integrated main provenance and CI-only scope
        if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'quality/main-ci-20261127')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'feature/j05-r2-p0-20261127')
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 63975ae83e82cf160a4e5361804fa5a7c01d3977 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test -n "$PR_BASE_SHA"
            git merge-base --is-ancestor "$PR_BASE_SHA" HEAD
          fi
          if [ "$PR_HEAD_REF" = "quality/main-ci-20261127" ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSH_REF" = "quality/main-ci-20261127" ]; }; then
            test "$(git diff --name-only 63975ae83e82cf160a4e5361804fa5a7c01d3977 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml .github/workflows/recovery-product-ci.yml | LC_ALL=C sort)"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
