name: J06 C2 browser simulation LAB (no deploy)
on:
  push:
    branches: [main, feature/j06-c2-browser-lab-20261127]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  price-ui-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Verify LAB provenance
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 57a6a6487c7553791e8c4ab747e0b3342c65e755 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - name: Build with temporary non-public React LAB entry
        run: |
          set -euo pipefail
          test ! -e apps/web/src/app/j07-lab
          mkdir apps/web/src/app/j07-lab
          trap 'rm -f apps/web/src/app/j07-lab/page.tsx; rmdir apps/web/src/app/j07-lab' EXIT
          cp apps/web/src/lab/j07/lab-page.tsx apps/web/src/app/j07-lab/page.tsx
          pnpm build
          pnpm --filter @panokit/web exec tsc --target ES2022 --lib ES2022,DOM --module commonjs --moduleResolution node --jsx react-jsx --esModuleInterop --skipLibCheck --strict --outDir .next/j07-renderer src/lab/j07/server-visual.ts
          test -f apps/web/.next/j07-renderer/lab/j07/server-visual.js
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Pinned Playwright installation
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Run actual PG17 browser simulation laboratory
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export J03_ADMISSION="$GITHUB_WORKSPACE/apps/api/dist/j03/industrial-admission.js"
          export J06_ENGINE="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-lab.js"
          export J06_PORT="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-pg-lab.js"
          export J06_HTTP="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-http-lab.js"
          export J07_REACT_ORIGIN="http://127.0.0.1:39177"
          export J07_RENDERER="$GITHUB_WORKSPACE/apps/web/.next/j07-renderer/lab/j07/server-visual.js"
          export J07_MASTER_NIGHT="$GITHUB_WORKSPACE/apps/web/public/studio-v4/STU-ENV-01-master-night.svg"
          pnpm --filter @panokit/web exec next start --hostname 127.0.0.1 --port 39177 >"$RUNNER_TEMP/j07-next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true; wait "$next_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 40); do
            if curl -fsS "$J07_REACT_ORIGIN/j07-lab" >/dev/null; then ready=true; break; fi
            if ! kill -0 "$next_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/j07-next.log"; exit 1; fi
          mkdir -m 700 "$RUNNER_TEMP/j06-ui-pg"
          cp apps/api/security/j03/industrial-lab.sql apps/api/security/j06/* "$RUNNER_TEMP/j06-ui-pg/"
          cp apps/api/security/sec01-compose/package-lock.json "$RUNNER_TEMP/j06-ui-pg/"
          cd "$RUNNER_TEMP/j06-ui-pg"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const l=JSON.parse(fs.readFileSync('package-lock.json'));
          assert.equal(l.packages['node_modules/embedded-postgres'].version,'17.12.0-beta.19');
          assert.equal(l.packages['node_modules/pg'].version,'8.16.3');
          for(const [name,v] of Object.entries(l.packages)) if(name){assert.equal(new URL(v.resolved).origin,'https://registry.npmjs.org');assert.match(v.integrity,/^sha512-/);}
          fs.writeFileSync('package.json',JSON.stringify({name:l.name,version:l.version,private:true,dependencies:l.packages[''].dependencies}));
          JS
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          export J06_CSS="$GITHUB_WORKSPACE/apps/web/src/app/prix-livraison/price.module.css"
          export J06_MASTER="$GITHUB_WORKSPACE/apps/web/public/studio-v4/STU-ENV-01-master-day.svg"
          export J06_UI_EVIDENCE="$RUNNER_TEMP/j06-ui-evidence"
          mkdir -p "$J06_UI_EVIDENCE"
          node quote-ui-lab.mjs --disposable-lab
          (cd "$J06_UI_EVIDENCE"; sha256sum *.png report.json j07-react-report.json j07-d2-report.json > SHA256SUMS; sha256sum -c SHA256SUMS)
      - name: Upload isolated simulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j06-c2-browser-lab-evidence
          path: ${{ runner.temp }}/j06-ui-evidence
          retention-days: 30
          if-no-files-found: error
