name: J05 R2 V4 Studio FUE (no deploy)
on:
  push:
    branches: [feature/j05-r2-p0-20261127, main, quality/main-ci-20261127]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  studio-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Verify exact product source boundary
        if: (github.event_name == 'push' && github.ref_name == 'feature/j05-r2-p0-20261127') || (github.event_name == 'pull_request' && github.head_ref == 'feature/j05-r2-p0-20261127')
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD
          git merge-base --is-ancestor 790f3ee74bc25c2cd0f9448f76b65d1e61c756ab HEAD
          test "$(git diff --name-only 790f3ee74bc25c2cd0f9448f76b65d1e61c756ab HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml apps/web/public/studio-v4/STU-ENV-01-master-day.svg apps/web/public/studio-v4/STU-ENV-01-master-night.svg apps/web/src/app/studio/page.tsx apps/web/src/app/studio/studio-client.tsx apps/web/src/app/studio/studio.css | LC_ALL=C sort)"
          git diff --exit-code 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD -- apps/web apps/api packages pnpm-lock.yaml
          test "$(git diff --name-only 626b7e50ca04a2d21a9309dd4be0df48675fd818 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml | LC_ALL=C sort)"
          (cd apps/web/public/studio-v4; printf '%s\n' '0ef2a0df848f1857d4f055c361ae3ccc24b98406b7bc3bfd4b0779976a3f7912  STU-ENV-01-master-day.svg' '460da17eda4a535a051a6bfea3fa329d5d294cc419a75ea8d583247366f0ea6c  STU-ENV-01-master-night.svg' | sha256sum -c -)
      - name: Verify integrated main provenance and CI-only scope
        if: (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'quality/main-ci-20261127')) || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'feature/j05-r2-p0-20261127')
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 63975ae83e82cf160a4e5361804fa5a7c01d3977 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            test -n "$PR_BASE_SHA"
            git merge-base --is-ancestor "$PR_BASE_SHA" HEAD
          fi
          if [ "$PR_HEAD_REF" = "quality/main-ci-20261127" ] || { [ "$GITHUB_EVENT_NAME" = push ] && [ "$PUSH_REF" = "quality/main-ci-20261127" ]; }; then
            test "$(git diff --name-only 63975ae83e82cf160a4e5361804fa5a7c01d3977 HEAD | LC_ALL=C sort)" = "$(printf '%s\n' .github/workflows/j02-bilingual.yml .github/workflows/j03-continuity.yml .github/workflows/j03-fue.yml .github/workflows/j03-industrial.yml .github/workflows/j03-pg.yml .github/workflows/j05-restored-fue.yml .github/workflows/recovery-product-ci.yml | LC_ALL=C sort)"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Pinned Playwright installation
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Capture actual Studio and audit
        run: |
          set -euo pipefail
          export J05_EVIDENCE="$RUNNER_TEMP/j05-evidence"
          export PRODUCT_SHA="$(git rev-parse HEAD)"
          mkdir -p "$J05_EVIDENCE"
          cat > "$RUNNER_TEMP/j05.mjs" <<'JS'
          import assert from 'node:assert/strict';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {createHash} from 'node:crypto';
          import {gzipSync} from 'node:zlib';
          import {chromium} from '/tmp/panokit-playwright/node_modules/playwright/index.mjs';
          const out=process.env.J05_EVIDENCE,origin='http://127.0.0.1:3000';
          mkdirSync(join(out,'raw'),{recursive:true});
          const browser=await chromium.launch({headless:true}),report={productSha:process.env.PRODUCT_SHA,checks:[],observations:[],captures:[],errors:[]};
          const check=(id,ok,detail)=>report.checks.push({id,ok:Boolean(ok),detail});
          const obs=(id,detail)=>report.observations.push({id,detail});
          const metrics=p=>p.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth,htmlLang:document.documentElement.lang,htmlDir:document.documentElement.dir,mainLang:document.querySelector('main').lang,mainDir:document.querySelector('main').dir,previewTop:document.querySelector('.studio-preview').getBoundingClientRect().top,sceneTop:document.querySelector('.studio-main-sign-scroll').getBoundingClientRect().top,sceneBottom:document.querySelector('.studio-main-sign-scroll').getBoundingClientRect().bottom,previewWidth:document.querySelector('.studio-main-sign-scroll').clientWidth,svgWidth:document.querySelector('.studio-main-sign-scroll svg').getBoundingClientRect().width}));
          const shot=async(p,key,state)=>{await p.evaluate(()=>document.fonts.ready);const file=key+'-'+state+'.jpeg';await p.screenshot({path:join(out,file),type:'jpeg',quality:92,fullPage:true,animations:'disabled'});report.captures.push(file)};
          const logo=Buffer.from(await (async()=>{const p=await browser.newPage();const a=await p.evaluate(()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,96,96);x.fillStyle='#184843';x.fillRect(10,10,76,76);x.fillStyle='#f46b0a';x.fillRect(25,25,46,46);return c.toDataURL('image/png').split(',')[1]});await p.close();return a})(),'base64');
          const wait=async(p,loc)=>{await loc.scrollIntoViewIfNeeded();await p.waitForTimeout(450)};
          const bounds=async(sign)=>sign.locator('[data-studio-name]').evaluateAll(nodes=>nodes.map(n=>{const b=n.getBBox(),g=n.closest('[data-studio-content]');return {x:b.x,y:b.y,w:b.width,h:b.height,kind:n.getAttribute('data-studio-name'),width:Number(g.dataset.width),height:Number(g.dataset.height)}}));
          const within=(b)=>b.length>0&&b.every(x=>x.x>=2&&x.y>=2&&x.x+x.w<=x.width-2&&x.y+x.h<=x.height-2);
          const ready=async(p,key)=>{
            const pending=new Map(),failures=[];
            const urlSafe=u=>{try{const a=new URL(u);return a.origin+a.pathname}catch{return 'unparseable'}};
            p.on('request',q=>pending.set(q,urlSafe(q.url())));
            p.on('requestfinished',q=>pending.delete(q));
            p.on('requestfailed',q=>{pending.delete(q);failures.push({url:urlSafe(q.url()),error:q.failure()?.errorText})});
            p.on('response',r=>{if(r.status()>=400)failures.push({url:urlSafe(r.url()),status:r.status()})});
            try{
              const response=await p.goto(origin+'/studio',{waitUntil:'domcontentloaded',timeout:30000});
              assert(response?.ok(),'Studio HTTP response must be successful');
              await p.locator('main.studio-page').waitFor({state:'visible',timeout:15000});
              await p.locator('#studio-name').waitFor({state:'visible',timeout:15000});
              await p.locator('.studio-main-sign-scroll svg').waitFor({state:'visible',timeout:15000});
              await p.waitForFunction(()=>document.readyState!=='loading'&&document.querySelectorAll('.studio-template').length===4,{},{timeout:15000});
              obs(key+'/navigation',{status:response.status(),pending:[...pending.values()],failures});
            }catch(e){
              obs(key+'/navigation-error',{url:urlSafe(p.url()),pending:[...pending.values()],failures});
              throw e;
            }
          };
          try{
          const proof=await browser.newPage();
          for(const [mode,expected] of [['day','0ef2a0df848f1857d4f055c361ae3ccc24b98406b7bc3bfd4b0779976a3f7912'],['night','460da17eda4a535a051a6bfea3fa329d5d294cc419a75ea8d583247366f0ea6c']]){
            const path='/studio-v4/STU-ENV-01-master-'+mode+'.svg',response=await proof.request.get(origin+path),bytes=await response.body();
            check('master/'+mode+'/http',response.ok(),response.status());
            check('master/'+mode+'/sha256',createHash('sha256').update(bytes).digest('hex')===expected);
            obs('master/'+mode+'/size',{raw:bytes.length,gzip:gzipSync(bytes).length});
          }
          await proof.goto(origin+'/studio?lang=ar',{waitUntil:'domcontentloaded'});
          check('direct-ar/SSR',(await proof.locator('main.studio-page').getAttribute('lang'))==='ar');
          await proof.close();
          for(const lang of ['fr','ar'])for(const width of [390,1440]){
          const key=lang+'-'+width,height=width===390?844:1000,ar=lang==='ar';
          const c=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,hasTouch:width===390,isMobile:width===390,recordVideo:{dir:join(out,'raw'),size:{width,height}}});
          const p=await c.newPage();p.on('pageerror',e=>report.errors.push({key,message:e.message}));
          const video=p.video(),main=p.locator('main.studio-page'),sign=p.locator('.studio-main-sign-scroll svg'),gate=p.locator('.studio-gate button'),name=p.locator('#studio-name'),tpl=p.locator('.studio-template'),views=p.locator('.studio-views button');
          try{
          await ready(p,key);
          if(ar)await p.getByRole('button',{name:'العربية',exact:true}).click();
          await p.waitForFunction(expected=>document.querySelector('main.studio-page')?.lang===expected,lang,{timeout:10000});
          check(key+'/locale',(await main.getAttribute('dir'))===(ar?'rtl':'ltr')&&(await main.getAttribute('lang'))===lang);
          check(key+'/initial-gate',await gate.isDisabled());
          check(key+'/four-templates',await tpl.count()===4);
          const init=await metrics(p);obs(key+'/initial-layout',init);check(key+'/no-page-overflow',init.scrollWidth<=width+1);
          check(key+'/scene-first-viewport',init.sceneTop>=0&&init.sceneBottom<=height+1,init);
          check(key+'/root-locale',init.htmlLang===lang&&init.htmlDir===(ar?'rtl':'ltr'));
          check(key+'/default-day',(await views.nth(1).getAttribute('aria-pressed'))==='true');
          await shot(p,key,'01-empty');
          const demo=ar?'متجر تجريبي':'ATELIER TEST';
          await name.fill(demo);await views.nth(0).click();await p.locator('#studio-info-panel summary').click();await p.locator('#studio-activity').fill(ar?'نشاط تجريبي':'Activité test');await p.locator('#studio-slogan').fill(ar?'نص تجريبي':'Slogan test');await p.locator('#studio-info-panel summary').click();
          check(key+'/live-name',(await sign.textContent()).includes(demo));await wait(p,sign);check(key+'/short-name-bounds',within(await bounds(sign)));await shot(p,key,'02-flat');
          for(let i=0;i<4;i++){await tpl.nth(i).click();check(key+'/template-'+(i+1),(await tpl.nth(i).getAttribute('aria-pressed'))==='true');check(key+'/template-name-'+(i+1),(await sign.textContent()).includes(demo));check(key+'/template-bounds-'+(i+1),within(await bounds(sign)))}
          await tpl.nth(1).click();check(key+'/no-logo',await sign.locator('[data-studio-logo]').count()===0);await p.locator('#studio-logo-panel summary').click();
          await p.locator('#studio-logo').setInputFiles({name:'test-only.png',mimeType:'image/png',buffer:logo});await sign.locator('[data-studio-logo]').waitFor({state:'attached'});
          check(key+'/logo-preview',(await sign.locator('[data-studio-logo]').getAttribute('href')).startsWith('data:image/png;'));await wait(p,sign);await shot(p,key,'03-logo');
          await views.nth(1).click();check(key+'/day',(await views.nth(1).getAttribute('aria-pressed'))==='true');check(key+'/day-master',(await sign.locator('[data-studio-master]').getAttribute('href')).endsWith('master-day.svg'));check(key+'/day-name-bounds',within(await bounds(sign)));await wait(p,sign);await shot(p,key,'04-day');
          await views.nth(2).click();check(key+'/night',(await views.nth(2).getAttribute('aria-pressed'))==='true');check(key+'/night-master',(await sign.locator('[data-studio-master]').getAttribute('href')).endsWith('master-night.svg'));check(key+'/night-name-bounds',within(await bounds(sign)));await wait(p,sign);await shot(p,key,'05-night');
          await p.locator('.studio-palette-option').nth(2).click();check(key+'/palette',(await p.locator('.studio-palette-option').nth(2).getAttribute('aria-pressed'))==='true');
          await p.locator('#studio-colors-panel summary').click();
          await p.locator('#studio-color-board').fill('#123456');
          check(key+'/custom-board',(await sign.locator('[data-studio-board]').getAttribute('fill'))==='#123456');
          await p.locator('#studio-color-lettering').fill('#abcdef');check(key+'/custom-lettering',(await sign.locator('[data-studio-name]').first().getAttribute('fill'))==='#abcdef');
          await p.locator('#studio-color-accent').fill('#fedcba');check(key+'/custom-accent',await sign.locator('[stroke="#fedcba"]').count()>0);
          await p.locator('.studio-color-reset').click();check(key+'/reset-palette',(await p.locator('.studio-palette-option').nth(2).getAttribute('aria-pressed'))==='true');
          await p.locator('.studio-text-button').click();check(key+'/remove-logo',await sign.locator('[data-studio-logo]').count()===0);
          await p.locator('#studio-logo').setInputFiles({name:'test-only.svg',mimeType:'image/svg+xml',buffer:Buffer.from('<svg xmlns="http://www.w3.org/2000/svg"/>')});
          check(key+'/reject-svg',await p.locator('#studio-logo-panel [role=alert]').isVisible());
          await p.locator('#studio-logo').setInputFiles({name:'fake.png',mimeType:'image/png',buffer:Buffer.from('not a PNG')});await p.locator('#studio-logo-panel [role=alert]').waitFor({state:'visible'});check(key+'/reject-spoof',await sign.locator('[data-studio-logo]').count()===0);
          await p.locator('#studio-logo-panel summary').click();
          await p.locator('#studio-colors-panel summary').click();
          await p.locator('.assistpanel summary').click();check(key+'/deterministic-assist',await p.locator('.assistpanel').getAttribute('open')!==null);await p.locator('.assistpanel summary').click();
          await views.nth(0).click();
          const long=ar?'اسم تجريبي طويل للغاية '.repeat(7).trim():'ATELIER TEST NOM COMMERCIAL TRES LONG '.repeat(5).trim();
          await name.fill(long);check(key+'/original-long-name',(await name.inputValue())===long);check(key+'/long-warning',await p.locator('.studio-preview [role=alert]').isVisible());
          await wait(p,sign);const longBounds=await bounds(sign);check(key+'/long-name-bounds',within(longBounds));check(key+'/long-name-explicit-adapt',longBounds.length===1&&longBounds[0].kind==='adapt');await shot(p,key,'06-long');
          for(let i=0;i<4;i++){await tpl.nth(i).click();check(key+'/long-bounds-template-'+(i+1),within(await bounds(sign)))}
          await name.fill('W'.repeat(27));for(let i=0;i<4;i++){await tpl.nth(i).click();check(key+'/wide-name-template-'+(i+1),within(await bounds(sign)))}
          await name.fill(long);check(key+'/long-all-tiles',await tpl.locator('[data-studio-name="adapt"]').count()===4);
          for(const mode of [1,2]){await views.nth(mode).click();check(key+'/long-facade-'+mode,within(await bounds(sign)))}
          await wait(p,gate);check(key+'/final-gate',await gate.isDisabled());await shot(p,key,'07-blocked');
          await name.focus();await p.keyboard.press('Tab');obs(key+'/keyboard-next',await p.evaluate(()=>({id:document.activeElement?.id,tag:document.activeElement?.tagName})));
          obs(key+'/final-layout',await metrics(p));
          const href=await p.locator('.studio-back').getAttribute('href');obs(key+'/back-href',href);check(key+'/back-href',href==='/catalogue/enseignes/lumineuses?lang='+lang);
          const backResponse=await p.request.get(origin+href);check(key+'/back-http',backResponse.ok(),backResponse.status());
          await p.locator('.studio-back').click();await p.waitForURL('**/catalogue/enseignes/lumineuses?lang='+lang);await p.locator('main').waitFor({state:'visible'});check(key+'/back-locale',(await p.locator('main').getAttribute('lang'))===lang);
          }catch(e){report.errors.push({key,message:String(e)});await shot(p,key,'error').catch(()=>{})}
          finally{await c.close();await video.saveAs(join(out,key+'.webm'))}
          }
          for(const lang of ['fr','ar'])for(const width of [195,320,375,414,768]){
          const p=await browser.newPage({viewport:{width,height:844}});const key=lang+'-'+width;
          try{await ready(p,key);if(lang==='ar')await p.getByRole('button',{name:'العربية',exact:true}).click();await p.locator('#studio-name').fill(lang==='ar'?'اختبار':'TEST');const m=await metrics(p);obs(key+'/reflow',m);check(key+'/no-page-overflow',m.scrollWidth<=width+1);if(width>=320)check(key+'/scene-first-viewport',m.sceneTop>=0&&m.sceneBottom<=845,m);check(key+'/gate',await p.locator('.studio-gate button').isDisabled());if(width===195||width===320)await shot(p,key,'reflow')}catch(e){report.errors.push({key,message:String(e)})}finally{await p.close()}
          }
          }finally{await browser.close();writeFileSync(join(out,'report.json'),JSON.stringify(report,null,2));console.log(JSON.stringify({checks:report.checks.length,passed:report.checks.filter(x=>x.ok).length,failed:report.checks.filter(x=>!x.ok),errors:report.errors,captures:report.captures.length}));}
          assert.equal(report.errors.length,0);assert.equal(report.checks.filter(x=>!x.ok).length,0);
          
          JS
          pnpm --filter @panokit/web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j05-next.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/studio >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/studio >/dev/null
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          set +e
          node "$RUNNER_TEMP/j05.mjs"
          result=$?
          set -e
          cp "$RUNNER_TEMP/j05-next.log" "$J05_EVIDENCE/server.log"
          for lang in fr ar; do
            for width in 390 1440; do
              key="$lang-$width"
              ffmpeg -nostdin -v error -y -i "$J05_EVIDENCE/$key.webm" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$J05_EVIDENCE/$key.mp4"
              ffmpeg -nostdin -v error -i "$J05_EVIDENCE/$key.mp4" -f null -
              ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of json "$J05_EVIDENCE/$key.mp4" > "$J05_EVIDENCE/$key-video.json"
              rm "$J05_EVIDENCE/$key.webm"
            done
          done
          rm -rf "$J05_EVIDENCE/raw"
          (cd "$J05_EVIDENCE"; sha256sum *.jpeg *.mp4 *.json server.log > SHA256SUMS)
          test "$result" = 0
          test "$(find "$J05_EVIDENCE" -maxdepth 1 -name '*.jpeg' | wc -l)" = 32
      - name: Upload Studio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j05-v4-studio-evidence
          path: ${{ runner.temp }}/j05-evidence
          retention-days: 30
          if-no-files-found: error
