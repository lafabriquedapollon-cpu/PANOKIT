name: J06 B PostgreSQL and HTTP LAB (no deploy)
on:
  push:
    branches: [main, feature/j06-b-pg-http-lab-20261127]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quote-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Verify isolated LAB provenance
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 12814eff19b6f754220309bde828e002156c3656 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Run actual PG17 quote and HTTP laboratory
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          export J03_ADMISSION="$GITHUB_WORKSPACE/apps/api/dist/j03/industrial-admission.js"
          export J06_ENGINE="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-lab.js"
          export J06_PORT="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-pg-lab.js"
          export J06_HTTP="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-http-lab.js"
          mkdir -m 700 "$RUNNER_TEMP/j06-pg"
          cp apps/api/security/j03/industrial-lab.sql apps/api/security/j06/* "$RUNNER_TEMP/j06-pg/"
          cp apps/api/security/sec01-compose/package-lock.json "$RUNNER_TEMP/j06-pg/"
          cd "$RUNNER_TEMP/j06-pg"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const l=JSON.parse(fs.readFileSync('package-lock.json'));
          assert.equal(l.packages['node_modules/embedded-postgres'].version,'17.12.0-beta.19');
          assert.equal(l.packages['node_modules/pg'].version,'8.16.3');
          for(const [name,v] of Object.entries(l.packages)) if(name){assert.equal(new URL(v.resolved).origin,'https://registry.npmjs.org');assert.match(v.integrity,/^sha512-/);}
          fs.writeFileSync('package.json',JSON.stringify({name:l.name,version:l.version,private:true,dependencies:l.packages[''].dependencies}));
          JS
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node quote-lab.mjs --disposable-lab
