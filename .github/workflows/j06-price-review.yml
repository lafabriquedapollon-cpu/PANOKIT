name: J06 D1 price review FUE (no deploy)
on:
  push:
    branches: [main, feature/j06-d1-price-review-20261127]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  price-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Verify integrated provenance
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f513562f0a277a34759fcef6ee1a27ee8a410506 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @panokit/web build
      - name: Pinned Playwright installation
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Verify actual blocked review and Studio continuity
        run: |
          set -euo pipefail
          export J06_EVIDENCE="$RUNNER_TEMP/j06-evidence"
          mkdir -p "$J06_EVIDENCE"
          pnpm --filter @panokit/web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j06-live-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/prix-livraison >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/prix-livraison >/dev/null
          set +e
          node apps/web/tests/j06-price-review.mjs
          result=$?
          set -e
          # Snapshot the live log into the evidence directory; shutdown cannot mutate it.
          cp "$RUNNER_TEMP/j06-live-server.log" "$J06_EVIDENCE/server.log"
          (cd "$J06_EVIDENCE"; sha256sum *.png *.json server.log > SHA256SUMS; sha256sum -c SHA256SUMS)
          test "$result" = 0
          test "$(find "$J06_EVIDENCE" -maxdepth 1 -name '*.png' | wc -l)" = 16
      - name: Upload J06 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j06-d1-price-review-evidence
          path: ${{ runner.temp }}/j06-evidence
          retention-days: 30
          if-no-files-found: error
