name: J02 bilingual candidate evidence (no deploy)
on:
  push:
    branches: [feature/j02-locale-20261127]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Exact source boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2387d6da4ba889660414135b429b74cbbe65a7c2 HEAD
          git diff --exit-code 2387d6da4ba889660414135b429b74cbbe65a7c2 HEAD -- apps/web/public pnpm-lock.yaml apps/api
          test "$(git hash-object apps/web/public/images/panokit-cards.webp)" = 51caff5be3a527de8a7e9946b2079095a7365817
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @panokit/web build
      - name: Browser setup pinned to previously qualified R4 lock
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Install and verify video encoder
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Capture actual baseline and run existing J02 regression
        run: |
          set -euo pipefail
          export J02_EVIDENCE="$RUNNER_TEMP/j02-evidence"
          mkdir -p "$J02_EVIDENCE"
          pnpm --filter @panokit/web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j02-next.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          node apps/web/scripts/j02-master-audit.mjs | tee "$J02_EVIDENCE/master-audit.json"
          set +e
          node apps/web/scripts/j02-master-audit.mjs --require-approved > "$J02_EVIDENCE/strict-gate.txt" 2>&1
          strict=$?
          node apps/web/scripts/j02-final-fr.mjs
          capture=$?
          node apps/web/scripts/j02-browser-check.mjs > "$J02_EVIDENCE/browser-regression.txt" 2>&1
          regression=$?
          node apps/web/scripts/j02-ar-check.mjs
          arabic=$?
          set -e
          cat "$J02_EVIDENCE/browser-regression.txt"
          printf 'strict_master_gate=%s\ncapture=%s\nregression=%s\n' "$strict" "$capture" "$regression" | tee "$J02_EVIDENCE/status.txt"
          for lang in fr ar; do
          for width in 390 1440; do
            if test -f "$J02_EVIDENCE/$lang-$width.webm"; then
              ffmpeg -nostdin -v error -y -i "$J02_EVIDENCE/$lang-$width.webm" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$J02_EVIDENCE/$lang-$width.mp4"
              ffprobe -v error -show_entries stream=codec_name,width,height:format=duration -of json "$J02_EVIDENCE/$lang-$width.mp4" > "$J02_EVIDENCE/video-$lang-$width.json"
              rm "$J02_EVIDENCE/$lang-$width.webm"
            fi
          done
          done
          for lang in fr ar; do
            for width in 390 1440; do
              test -s "$J02_EVIDENCE/$lang-$width.mp4"
            done
          done
          rm -rf "$J02_EVIDENCE/raw"
          (cd "$J02_EVIDENCE"; sha256sum *.jpeg *.mp4 *.json *.txt > SHA256SUMS)
          test "$capture" = 0
          test "$regression" = 0
          test "$arabic" = 0
          test "$strict" = 1
      - name: Upload bilingual candidate proof (not release approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j02-bilingual-evidence
          path: ${{ runner.temp }}/j02-evidence
          if-no-files-found: error
          retention-days: 30
