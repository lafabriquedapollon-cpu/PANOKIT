name: R4-CI-RUNNER-01
on:
  push:
    paths:
      - '.github/workflows/r4-ci-runner-01.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r4-ci-runner-01
  cancel-in-progress: false
jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Prepare disposable synthetic lab
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          test "$(node --version)" = v22.16.0
          openssl version
          mkdir -m 700 "$RUNNER_TEMP/panokit-runtime"
          cd "$RUNNER_TEMP/panokit-runtime"
          cat > package.json <<'JSON'
          {"name":"panokit-ci-runtime","version":"0.0.0","private":true,"type":"module","dependencies":{"better-auth":"1.7.26","pg":"8.16.3","embedded-postgres":"17.12.0-beta.19","typescript":"5.9.3","reflect-metadata":"0.2.2","@nestjs/common":"11.2.10","@nestjs/core":"11.2.10","@nestjs/platform-express":"11.2.10"}}
          JSON
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json'));
          const l=JSON.parse(fs.readFileSync('package-lock.json'));
          assert.equal(l.lockfileVersion,3);
          for(const [name,version] of Object.entries(p.dependencies)) assert.equal(l.packages['node_modules/'+name].version,version);
          for(const [name,v] of Object.entries(l.packages)){
            if(!name) continue;
            assert.equal(new URL(v.resolved).origin,'https://registry.npmjs.org');
            assert.match(v.integrity,/^sha512-[A-Za-z0-9+/]+={0,2}$/);
          }
          console.log('LOCK_INTEGRITY PASS');
          JS
          sha256sum package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          sha256sum package-lock.json
      - name: Verify imports and real PostgreSQL
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/panokit-runtime"
          cat > runtime-probe.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,mkdtempSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          import {createRequire} from 'node:module';
          import {randomBytes} from 'node:crypto';
          import {createServer} from 'node:net';
          const require=createRequire(import.meta.url), PORT=55446;
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          for(const [name,version] of Object.entries(pkg.dependencies)){
            assert.equal(JSON.parse(readFileSync('node_modules/'+name+'/package.json','utf8')).version,version);
          }
          require('reflect-metadata');
          require('@nestjs/common');
          require('@nestjs/core');
          require('@nestjs/platform-express');
          assert.equal(require('typescript').version,'5.9.3');
          const {betterAuth}=await import('better-auth');
          const {twoFactor}=await import('better-auth/plugins');
          const {default:EmbeddedPostgres}=await import('embedded-postgres');
          const {Client}=await import('pg');
          for(const f of [betterAuth,twoFactor,EmbeddedPostgres,Client]) assert.equal(typeof f,'function');
          console.log('IMPORTS PASS');
          async function free(){
            const s=createServer();
            await new Promise((r,j)=>{s.once('error',j);s.listen(PORT,'127.0.0.1',r)});
            await new Promise((r,j)=>s.close(e=>e?j(e):r()));
          }
          await free();
          const dir=mkdtempSync(join(tmpdir(),'panokit-synthetic-'));
          const password=randomBytes(32).toString('hex');
          let cluster,client,attempted=false,pass=false,clean=true;
          try {
            cluster=new EmbeddedPostgres({databaseDir:dir,user:'postgres',password,port:PORT,authMethod:'scram-sha-256',persistent:true,postgresFlags:['-c','listen_addresses=127.0.0.1'],autoRehydrateSymlinks:true,onLog:()=>{},onError:()=>{}});
            await cluster.initialise();
            attempted=true;
            await cluster.start();
            client=new Client({host:'127.0.0.1',port:PORT,database:'postgres',user:'postgres',password,connectionTimeoutMillis:5000,statement_timeout:10000});
            await client.connect();
            const {rows:[info]}=await client.query("select current_setting('server_version_num')::int as version, current_setting('listen_addresses') as bind, inet_server_addr()::text as addr");
            assert.equal(info.version,170012);
            assert.equal(info.bind,'127.0.0.1');
            assert.match(info.addr,/^127\.0\.0\.1(?:\/32)?$/);
            await client.query('create temporary table ci_probe (id integer primary key)');
            await client.query('insert into ci_probe values (1)');
            assert.equal((await client.query('select id from ci_probe')).rows[0].id,1);
            console.log('PG17 PASS', JSON.stringify(info));
            pass=true;
          } catch(e) {
            console.error('PG17 FAIL', e instanceof assert.AssertionError?'ASSERTION':'RUNTIME', /^[A-Z0-9_]{1,40}$/.test(e?.code??'')?e.code:'UNCLASSIFIED');
          } finally {
            if(client) try{await client.end()}catch{clean=false}
            if(attempted) try{await cluster.stop()}catch{clean=false}
            try{await free()}catch{clean=false}
            if(clean) try{rmSync(dir,{recursive:true})}catch{clean=false}
            console.log('CLEANUP',clean?'PASS':'FAIL');
            process.exitCode=pass&&clean?0:1;
          }
          JS
          node --check runtime-probe.mjs
          node runtime-probe.mjs
      - name: Record scope
        run: |
          echo 'Runtime only: synthetic PostgreSQL; no SEC-01 qualification or deployment.' >> "$GITHUB_STEP_SUMMARY"
