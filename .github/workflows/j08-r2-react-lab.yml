name: J08 R2 React read-only LAB (no deploy)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  j08-r2-react:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - run: pnpm install --frozen-lockfile
      - name: Build isolated React proof (no committed public route)
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1c5c23aef31a578408f4e66aebf7c86e79664529 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e apps/web/src/app/bat
          mkdir -p apps/web/src/app/bat/react-proof
          trap 'rm -f apps/web/src/app/bat/react-proof/page.tsx; rmdir apps/web/src/app/bat/react-proof apps/web/src/app/bat' EXIT
          cat > apps/web/src/app/bat/react-proof/page.tsx <<'TSX'
          import {BatR2Fixture,BatR2ReadOnly} from '@/lib/j08/r2/bat-r2';
          import '@/lib/j08/r2/r2.css';
          export const dynamic='force-dynamic';
          export default async function Page({searchParams}:{searchParams:Promise<{lang?:string;fixture?:string}>}){
            const p=await searchParams,lang=p.lang==='ar'?'ar':'fr';
            return typeof p.fixture==='string' ? <BatR2Fixture id={p.fixture} lang={lang}/> : <BatR2ReadOnly lang={lang}/>;
          }
          TSX
          pnpm build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.16.0"
      - name: Install pinned Playwright
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: Real React and Chromium with isolated BAT broker
        run: |
          set -euo pipefail
          export J06_PORT="$GITHUB_WORKSPACE/apps/api/dist/j06/quote-pg-lab.js"
          export J08_REACT_ORIGIN=http://127.0.0.1:39178
          export J08_EVIDENCE="$RUNNER_TEMP/j08-r2-evidence"
          mkdir -p "$J08_EVIDENCE"
          pnpm --filter @panokit/web exec next start --hostname 127.0.0.1 --port 39178 >"$RUNNER_TEMP/j08-next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" 2>/dev/null || true; wait "$next_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 40); do
            if curl -fsS "$J08_REACT_ORIGIN/bat/react-proof?fixture=11-invalide" >/dev/null; then ready=true; break; fi
            if ! kill -0 "$next_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/j08-next.log"; exit 1; fi
          node apps/api/security/j06/bat-react-r2-lab.mjs
          (cd "$J08_EVIDENCE"; sha256sum *.png j08-r2-report.json > SHA256SUMS; sha256sum -c SHA256SUMS)
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j08-r2-react-lab-evidence
          path: ${{ runner.temp }}/j08-r2-evidence
          retention-days: 30
          if-no-files-found: warn
