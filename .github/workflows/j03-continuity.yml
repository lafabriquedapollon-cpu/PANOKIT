name: J03 existing catalogue qualification (no deploy)
on:
  push:
    branches: [feature/j03-continuity-20261127]
  pull_request:
    branches: [feature/j02-locale-20261127, main]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.22.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.13.1"
      - name: Exact source boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2387d6da4ba889660414135b429b74cbbe65a7c2 HEAD
          git merge-base --is-ancestor c5f74edc3f68f8df8476e2272b06473dadad163d HEAD
          git diff --exit-code c5f74edc3f68f8df8476e2272b06473dadad163d HEAD -- apps/web/public pnpm-lock.yaml apps/api
          test "$(git hash-object apps/web/public/images/panokit-cards.webp)" = 51caff5be3a527de8a7e9946b2079095a7365817
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Browser setup pinned to previously qualified R4 lock
        run: |
          set -euo pipefail
          mkdir -p /tmp/panokit-playwright
          cp apps/api/security/sec01-compose/browser.package-lock.json /tmp/panokit-playwright/package-lock.json
          cd /tmp/panokit-playwright
          printf '%s\n' '{"name":"panokit-browser-lab","version":"0.0.0","private":true,"dependencies":{"playwright":"1.65.1"}}' > package.json
          echo '089dd64d2f709c5ac17b105afb5d1ef79c2af98d6a9afe597955b431d9b90c28  package-lock.json' | sha256sum -c -
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/playwright install chromium
      - name: J03 existing catalogue and Arabic continuity
        run: |
          set -euo pipefail
          mkdir -p proof
          pnpm --filter @panokit/web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/j03-next.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:3000/ >/dev/null
          node apps/web/scripts/j02-browser-check.mjs
          node apps/web/scripts/j03-browser-check.mjs
          node apps/web/scripts/j03-continuity-check.mjs
          (cd proof; sha256sum *.png *.jpeg > SHA256SUMS)
      - name: Upload existing catalogue proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: j03-existing-catalogue-proof
          path: proof
          retention-days: 30
          if-no-files-found: error
