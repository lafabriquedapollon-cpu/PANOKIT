<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PANOKIT — FUE SEC-01 LAB</title>
<style>body{font:16px system-ui,sans-serif;background:#f5f5f5;color:#202020;max-width:740px;margin:40px auto;padding:24px}main{background:white;border:1px solid #ccc;padding:24px;border-radius:12px}h1{font-size:26px}label{display:block;margin:14px 0 4px}input,button{font:inherit;padding:10px;border:1px solid #999;border-radius:6px}input{width:calc(100% - 22px)}button{margin-top:12px;margin-right:8px;background:#222;color:white;cursor:pointer}button:disabled{opacity:.5}#status{padding:12px;background:#eee;border-left:4px solid #555}small{display:block;color:#555;margin:10px 0}[hidden]{display:none!important}</style></head>
<body><main><small>PANOKIT · banc FUE isolé · aucune donnée ni tarification réelle</small><h1>Administration sécurisée</h1><p id="status" role="status">Déconnecté</p>
<section id="login"><h2>Connexion</h2><label for="email">Identifiant</label><input id="email" type="email" autocomplete="off"><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="off"><button id="begin">Se connecter</button></section>
<section id="mfa" hidden><h2>Deuxième facteur</h2><label for="otp">Code temporaire</label><input id="otp" type="password" inputmode="numeric" autocomplete="off"><button id="verify">Valider le code</button></section>
<section id="editor" hidden><h2>Configuration tarifaire synthétique</h2><label for="revision">Révision attendue</label><input id="revision" type="number" min="1" value="1"><label for="value">Valeur de test (sans unité monétaire)</label><input id="value" type="number" value="0"><button id="save">Enregistrer</button><button id="retry" disabled>Répéter la même opération</button><button id="logout">Se déconnecter</button></section></main>
<script>
"use strict";const el=id=>document.getElementById(id);let flow=null,csrf=null,operation=null;
function display(t){el("status").textContent=t}
function view(id){for(const x of ["login","mfa","editor"])el(x).hidden=x!==id}
async function request(route,data,token){const headers={"content-type":"application/json"};if(token)headers["x-sec01-csrf"]=token;const response=await fetch("/sec01/"+route,{method:"POST",credentials:"same-origin",headers,body:JSON.stringify(data)});return {status:response.status,body:await response.json()}}
async function run(button,fn){button.disabled=true;try{await fn()}catch{display("Erreur réseau — aucune confirmation")}finally{button.disabled=false}}
el("begin").onclick=()=>run(el("begin"),async()=>{const email=el("email").value,password=el("password").value;el("email").value="";el("password").value="";const x=await request("begin",{email,password});if(x.status!==200){display("Accès refusé");return}flow=x.body.flow;csrf=x.body.csrf;view("mfa");display("Deuxième facteur requis")});
el("verify").onclick=()=>run(el("verify"),async()=>{const code=el("otp").value;el("otp").value="";const x=await request("complete",{flow,code},csrf);if(x.status!==200){display("MFA refusé");return}const y=await request("issue",{proof:x.body.proof},x.body.csrf);if(y.status!==200||y.body.ok!==true){display("Session refusée");return}csrf=y.body.csrf;flow=null;view("editor");display("Session privilégiée active")});
async function save(){const x=await request("write",operation,csrf);if(x.status!==200){display("Écriture refusée — aucune confirmation");return}if(!Number.isInteger(x.body.revision)||typeof x.body.replayed!=="boolean"){display("Réponse non confirmée");return}display((x.body.replayed?"Rejeu confirmé":"Enregistrement confirmé")+" — révision "+x.body.revision)}
el("save").onclick=()=>run(el("save"),async()=>{operation={operation:crypto.randomUUID(),revision:Number(el("revision").value),config:{fueFixture:Number(el("value").value)}};el("retry").disabled=false;await save()});
el("retry").onclick=()=>run(el("retry"),save);
el("logout").onclick=()=>run(el("logout"),async()=>{const x=await request("logout",{},csrf);if(x.status!==200||x.body.ok!==true){display("Déconnexion non confirmée");return}csrf=null;flow=null;operation=null;el("retry").disabled=true;view("login");display("Déconnecté — session révoquée")});
</script></body></html>
